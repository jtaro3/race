<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d19" />
  <meta name="description" content="Canvas 2Dで遊べるネオン・カートレース" />
  <title>NEON LAP — Canvas Kart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">NL</span><span>NEON LAP</span></div>
      <div class="status"><span class="dot"></span><span>ARCADE CIRCUIT 01</span></div>
      <button id="soundBtn" class="icon-btn" aria-label="サウンド切替">SOUND ON</button>
    </header>

    <section class="game-frame" aria-label="カートレースゲーム">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="レース画面。矢印キーまたはWASDで操作します"></canvas>
      <div class="scanlines" aria-hidden="true"></div>

      <div class="hud hud-left">
        <span class="eyebrow">POSITION</span>
        <div><strong id="position">1</strong><span class="fraction">/ 6</span></div>
      </div>
      <div class="hud hud-center">
        <span class="eyebrow">LAP</span>
        <strong><span id="lap">1</span><span class="fraction"> / 3</span></strong>
      </div>
      <div class="hud hud-right">
        <span class="eyebrow">SPEED</span>
        <div><strong id="speed">000</strong><span class="unit">KM/H</span></div>
      </div>

      <div id="startScreen" class="overlay show">
        <div class="start-card">
          <span class="kicker">MIDNIGHT GRAND PRIX</span>
          <h1>CHASE THE<br><em>APEX.</em></h1>
          <p>3周のナイトレース。ブーストパッドを踏んで、ライバルを抜き去れ。</p>
          <button id="startBtn" class="primary">START ENGINE <span>↗</span></button>
          <div class="keys"><span><kbd>W</kbd><kbd>↑</kbd> 加速</span><span><kbd>A</kbd><kbd>D</kbd> ステア</span><span><kbd>S</kbd><kbd>↓</kbd> ブレーキ</span></div>
        </div>
      </div>

      <div id="countdown" class="countdown" aria-live="polite"></div>
      <div id="finishScreen" class="overlay">
        <div class="finish-card">
          <span class="kicker">RACE COMPLETE</span>
          <div id="finishPlace" class="finish-place">1ST</div>
          <h2>FINISH</h2>
          <div class="result-row"><span>TOTAL TIME</span><strong id="finalTime">00:00.000</strong></div>
          <button id="restartBtn" class="primary">RACE AGAIN <span>↻</span></button>
        </div>
      </div>

      <div class="mobile-controls" aria-label="タッチ操作">
        <button data-key="ArrowLeft" aria-label="左へ曲がる">←</button>
        <button data-key="ArrowUp" aria-label="加速">↑</button>
        <button data-key="ArrowDown" aria-label="ブレーキ">↓</button>
        <button data-key="ArrowRight" aria-label="右へ曲がる">→</button>
      </div>
    </section>

    <footer>
      <div><span>BEST LAP</span><strong id="bestLap">--:--.---</strong></div>
      <div class="race-time"><span>RACE TIME</span><strong id="raceTime">00:00.000</strong></div>
      <p>STAY ON TRACK <span>•</span> HIT BOOST PADS <span>•</span> OWN THE NIGHT</p>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
